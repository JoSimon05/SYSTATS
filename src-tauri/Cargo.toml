[package]
name = "SYSTATS"
version = "1.0.0"
description = "A better System Stats Overlay by Jo"
authors = ["Jo"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.96.0"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
nvml-wrapper = "0.12.1"
once_cell = "1.21.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.38.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-wallpaper = "3.0.0"
windows-capture = "2.0.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
